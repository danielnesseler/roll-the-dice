<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spiral Blob Packing — Butting & Melting</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 340px 1fr;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background:#0e1014; color:#eaecef;
  }
  aside { background:#12141b; border-right:1px solid #0006; padding:14px; overflow:auto; }
  main  { display:grid; place-items:center; }
  canvas { width:min(96vw, 1600px); height:auto; background:#0f1117; border-radius:14px; box-shadow:0 14px 48px #000a; }

  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.85; margin:16px 0 8px; }
  .group { background:#0f1117; border:1px solid #ffffff18; border-radius:10px; padding:10px; margin-bottom:10px; }
  .row { display:grid; grid-template-columns: 1fr auto; gap:8px; align-items:center; margin:8px 0; }
  .row input[type="range"], .row input[type="number"], .row select { width:100%; }
  .two  { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .swatches{ display:flex; gap:4px; flex-wrap:wrap; }
  .swatch { width:18px; height:18px; border-radius:4px; border:1px solid #0006; }
  small.note { opacity:.75; font-size:12px; line-height:1.4; display:block; }
</style>
</head>
<body>
  <aside>
    <div class="group">
      <h2>Canvas</h2>
      <div class="row"><label>Width</label><input id="W" type="number" min="400" max="4000" value="1200"></div>
      <div class="row"><label>Height</label><input id="H" type="number" min="300" max="3000" value="900"></div>
      <div class="row"><label>Background</label><input id="bg" type="color" value="#0f1117"></div>
      <div class="two"><button id="resize">Resize</button><button id="save">Save PNG</button></div>
    </div>

    <div class="group">
      <h2>Blobs & Spiral</h2>
      <div class="row"><label>Seed</label><input id="seed" type="number" value="1234567"><button id="dice">🎲</button></div>
      <div class="row"><label>Blob count</label><input id="count" type="range" min="5" max="800" value="200"><span id="countV">200</span></div>
      <div class="row"><label>Min radius</label><input id="minR" type="range" min="6" max="160" value="20"><span id="minRV">20</span></div>
      <div class="row"><label>Max radius</label><input id="maxR" type="range" min="8" max="260" value="80"><span id="maxRV">80</span></div>
      <div class="row"><label>Spiral tightness</label><input id="tight" type="range" min="0.2" max="6" step="0.1" value="2.4"><span id="tightV">2.4</span></div>
      <div class="row"><label>Step (Δθ)</label><input id="dtheta" type="range" min="0.01" max="0.5" step="0.01" value="0.08"><span id="dthetaV">0.08</span></div>
      <div class="row"><label>Edge wiggle</label><input id="wiggle" type="range" min="0" max="0.45" step="0.01" value="0.18"><span id="wiggleV">0.18</span></div>
      <small class="note">Blobs are placed along an Archimedean spiral from the center; each is slid to gently touch a neighbor.</small>
    </div>

    <div class="group">
      <h2>Colors</h2>
      <div class="row"><label>Palette</label>
        <select id="palMode">
          <option value="triadic" selected>triadic</option>
          <option value="analogous">analogous</option>
          <option value="complement">complement</option>
          <option value="mono">mono</option>
          <option value="random">random</option>
        </select>
      </div>
      <div class="row"><label>Hue seed (°)</label><input id="hueSeed" type="range" min="0" max="359" value="30"><span id="hueSeedV">30</span></div>
      <div class="row"><label>Sat %</label><input id="sat" type="range" min="0" max="100" value="75"><span id="satV">75</span></div>
      <div class="row"><label>Light %</label><input id="lit" type="range" min="0" max="100" value="55"><span id="litV">55</span></div>
      <div class="row"><label>Palette size</label><input id="palSize" type="range" min="3" max="10" value="6"><span id="palSizeV">6</span></div>
      <div class="swatches" id="swatches"></div>
      <div class="row"><label>Outline</label>
        <select id="outline">
          <option value="none" selected>none</option>
          <option value="hair">hairline</option>
          <option value="bold">bold</option>
        </select>
      </div>
    </div>

    <div class="two">
      <button id="regenerate">Regenerate</button>
      <button id="randomize">Randomize Seed</button>
    </div>
  </aside>

  <main>
    <canvas id="view" width="1200" height="900"></canvas>
  </main>

<script>
/* -------- utilities -------- */
const $ = s => document.querySelector(s);
function mulberry32(a){ return function(){ let t=a+=0x6D2B79F5; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
const lerp = (a,b,t)=> a+(b-a)*t;
const clamp = (v,lo,hi)=> Math.min(hi, Math.max(lo, v));
const normHue = h=> ((h%360)+360)%360;

/* -------- palette -------- */
function hslToHex(h,s,l){
  l/=100; const a=(s*Math.min(l,1-l))/100;
  const f=n=>{ const k=(n+h/30)%12; const c=l-a*Math.max(Math.min(k-3,9-k,1),-1); return Math.round(255*c).toString(16).padStart(2,'0'); };
  return `#${f(0)}${f(8)}${f(4)}`;
}
function buildPalette(mode, size, hueSeed, sat, lit, rng){
  if (mode==='random') return Array.from({length:size}, ()=> hslToHex(Math.floor(rng()*360), sat, lit));
  let offsets=[];
  if (mode==='triadic') offsets=[0,120,240];
  else if (mode==='analogous') offsets=[-60,-30,0,30,60];
  else if (mode==='complement') offsets=[0,180];
  else if (mode==='mono') offsets=[0];
  const hues = Array.from({length:size}, (_,i)=> normHue(hueSeed + offsets[i % offsets.length]));
  return hues.map(h=> hslToHex(h, sat, lit));
}
function showSwatches(pal){
  const s=$('#swatches'); s.innerHTML=''; pal.forEach(h=>{ const d=document.createElement('div'); d.className='swatch'; d.style.background=h; s.appendChild(d); });
}

/* -------- blob placement on spiral -------- */
function placeBlobs({W,H,count,minR,maxR,tight,dtheta,wiggle, rng, palette}){
  const cx=W/2, cy=H/2;
  const blobs=[]; // {x,y,r,color,shapePhase,shapeFreq}

  let theta=0;
  const base = Math.min(W,H)*0.02;     // initial spiral radius
  const scale = (minR+maxR)*0.35 * tight; // spiral growth per radian

  function nonOverlap(x,y,r){
    for (const b of blobs){
      const d = Math.hypot(x-b.x, y-b.y);
      if (d < r + b.r - 0.25) return false; // small epsilon
    }
    // keep within canvas with a border:
    if (x-r<2 || y-r<2 || x+r>W-2 || y+r>H-2) return false;
    return true;
  }

  function slideToTangent(x,y,r){
    // Move towards the nearest neighbor until just touching (if possible)
    let best=null, bestD=Infinity, bestB=null;
    for (const b of blobs){
      const d = Math.hypot(x-b.x, y-b.y);
      if (d<bestD){ bestD=d; bestB=b; }
    }
    if (!bestB) return {x,y};

    const targetD = r + bestB.r;
    const gap = bestD - targetD; // >0 means we can move closer
    if (gap <= 0.05) return {x,y}; // already tangent-ish

    // Move along line towards neighbor by "gap", but check we don't hit others
    const ux = (bestB.x - x) / (bestD || 1);
    const uy = (bestB.y - y) / (bestD || 1);
    const steps = Math.ceil(gap/1.0);
    let nx=x, ny=y;
    for (let i=0;i<steps;i++){
      const tx = nx + ux * (gap/steps);
      const ty = ny + uy * (gap/steps);
      // check overlap with all
      let ok=true;
      for (const b of blobs){
        const d = Math.hypot(tx-b.x, ty-b.y);
        if (d < r + b.r - 0.05) { ok=false; break; }
      }
      if (!ok) break;
      nx=tx; ny=ty;
    }
    return {x:nx, y:ny};
  }

  for (let i=0;i<count;i++){
    // circle radius (bias to smaller via square of rng)
    const t = Math.pow(rng(), 1.1);
    const r = clamp(lerp(minR, maxR, t), minR, maxR);

    if (i===0){
      blobs.push({
        x:cx, y:cy, r,
        color: palette[0 % palette.length],
        shapePhase: rng()*Math.PI*2,
        shapeFreq: 2 + Math.floor(rng()*4) // 2..5 lobes
      });
      continue;
    }

    // walk the spiral until a non-overlapping spot is found
    let placed=false;
    let guard=0, localTheta=theta;
    while (!placed && guard<20000){
      localTheta += dtheta;
      const rad = base + scale * localTheta;
      const x = cx + rad * Math.cos(localTheta);
      const y = cy + rad * Math.sin(localTheta);
      if (nonOverlap(x,y,r)){
        // try to butt up to nearest neighbor
        const p = slideToTangent(x,y,r);
        if (nonOverlap(p.x,p.y,r)){
          blobs.push({
            x:p.x, y:p.y, r,
            color: palette[i % palette.length],
            shapePhase: rng()*Math.PI*2,
            shapeFreq: 2 + Math.floor(rng()*4)
          });
          theta = localTheta;
          placed=true;
        }
      }
      guard++;
      // if spiral runs off-screen for a long while, relax radius
      if (guard%4000===0) { // shrink slightly to help fit
        // (optional heuristic)
      }
    }

    if (!placed){
      // fallback: skip this blob
      // (keeps the demo robust even at very high counts)
    }
  }

  // store wiggle for renderer
  return {blobs, wiggle};
}

/* -------- rendering -------- */
function drawBlobs(ctx, W, H, bg, outline, blobsObj){
  const {blobs, wiggle} = blobsObj;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  for (const b of blobs){
    // organic blob: radius perturbed by small harmonic
    const steps = Math.max(24, Math.floor(b.r*1.2));
    const phase = b.shapePhase;
    const freq = b.shapeFreq;
    const amp = wiggle * b.r; // pixels

    ctx.beginPath();
    for (let i=0;i<=steps;i++){
      const t = (i/steps)*Math.PI*2;
      const wob = Math.sin(t*freq + phase) + 0.5*Math.sin(t*(freq+1) + phase*1.7);
      const rr = b.r + amp * (wob*0.5);
      const x = b.x + rr * Math.cos(t);
      const y = b.y + rr * Math.sin(t);
      (i===0) ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();

    ctx.fillStyle = b.color;
    ctx.fill();

    if (outline!=='none'){
      ctx.lineWidth = (outline==='bold') ? 1.6 : 0.8;
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.stroke();
    }
  }
}

/* -------- DOM + wiring -------- */
const view = $('#view'), ctx = view.getContext('2d');
const ui = {
  W: $('#W'), H: $('#H'), bg: $('#bg'), resize: $('#resize'), save: $('#save'),
  seed: $('#seed'), dice: $('#dice'),
  count: $('#count'), countV: $('#countV'),
  minR: $('#minR'), minRV: $('#minRV'),
  maxR: $('#maxR'), maxRV: $('#maxRV'),
  tight: $('#tight'), tightV: $('#tightV'),
  dtheta: $('#dtheta'), dthetaV: $('#dthetaV'),
  wiggle: $('#wiggle'), wiggleV: $('#wiggleV'),
  palMode: $('#palMode'),
  hueSeed: $('#hueSeed'), hueSeedV: $('#hueSeedV'),
  sat: $('#sat'), satV: $('#satV'),
  lit: $('#lit'), litV: $('#litV'),
  palSize: $('#palSize'), palSizeV: $('#palSizeV'),
  outline: $('#outline'),
  regenerate: $('#regenerate'), randomize: $('#randomize'),
  swatches: $('#swatches')
};

function syncReads(){
  ui.countV.textContent  = ui.count.value;
  ui.minRV.textContent   = ui.minR.value;
  ui.maxRV.textContent   = ui.maxR.value;
  ui.tightV.textContent  = ui.tight.value;
  ui.dthetaV.textContent = ui.dtheta.value;
  ui.wiggleV.textContent = ui.wiggle.value;
  ui.hueSeedV.textContent= ui.hueSeed.value;
  ui.satV.textContent    = ui.sat.value;
  ui.litV.textContent    = ui.lit.value;
  ui.palSizeV.textContent= ui.palSize.value;
}

function render(){
  syncReads();
  const W = +ui.W.value, H = +ui.H.value;
  if (view.width!==W || view.height!==H){ view.width=W; view.height=H; }

  const rng = mulberry32((+ui.seed.value|0)>>>0);
  const palette = buildPalette(ui.palMode.value, +ui.palSize.value, +ui.hueSeed.value, +ui.sat.value, +ui.lit.value, rng);
  showSwatches(palette);

  const cfg = {
    W,H,
    count:+ui.count.value,
    minR:+ui.minR.value,
    maxR:+ui.maxR.value,
    tight:+ui.tight.value,
    dtheta:+ui.dtheta.value,
    wiggle:+ui.wiggle.value,
    rng,
    palette
  };

  const blobs = placeBlobs(cfg);
  drawBlobs(ctx, W, H, ui.bg.value, ui.outline.value, blobs);
}

/* events */
[
  'W','H','bg','seed',
  'count','minR','maxR','tight','dtheta','wiggle',
  'palMode','hueSeed','sat','lit','palSize','outline'
].forEach(id => $('#'+id).addEventListener('input', render));

$('#resize').addEventListener('click', render);
$('#save').addEventListener('click', ()=>{
  const a=document.createElement('a'); a.download=`spiral_blobs_${Date.now()}.png`; a.href=view.toDataURL('image/png'); a.click();
});
$('#dice').addEventListener('click', ()=>{ ui.seed.value = Math.floor(Math.random()*1e9); render(); });
$('#regenerate').addEventListener('click', render);
$('#randomize').addEventListener('click', ()=>{ ui.seed.value = Math.floor(Math.random()*1e9); render(); });

/* init */
render();
</script>
</body>
</html>
