<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tessellation → 3D (Fixed sizing)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body { height: 100vh; display: grid; grid-template-rows: auto 1fr; font-family: system-ui, sans-serif; }
    header { padding:10px 14px; display:flex; gap:12px; align-items:center; border-bottom:1px solid #0004; }
    label { display:inline-flex; align-items:center; gap:6px; font-size:14px; }
    #swatches { display:inline-flex; gap:4px; margin-left:auto; }
    .swatch { width:18px; height:18px; border-radius:4px; border:1px solid #0003; }
    /* CRUCIAL: give the stage a definite height */
    #stage { position: relative; width: 100%; height: 100%; min-height: 0; background:#111; }
    canvas { display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <header>
    <button id="regen">Regenerate</button>
    <label>σ <input id="sigma" type="range" min="1" max="18" value="9"><span id="sigmaVal">9</span></label>
    <label>Scale <input id="scale" type="range" min="2" max="8" value="4"><span id="scaleVal">4</span></label>
    <label>Bands <input id="bands" type="range" min="3" max="12" value="5"><span id="bandsVal">5</span></label>
    <label>Repeat <input id="repeat" type="range" min="1" max="12" value="3"><span id="repeatVal">3</span></label>
    <div id="swatches"></div>
  </header>
  <div id="stage"></div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    // ---------- small utils ----------
    const $ = s => document.querySelector(s);
    const rand = (min, max) => Math.floor(Math.random() * (Math.floor(max) - Math.ceil(min) + 1) + Math.ceil(min));
    const normHue = h => ((h % 360) + 360) % 360;
    function hslToHex(h,s,l){
      l/=100; const a=(s*Math.min(l,1-l))/100;
      const f=n=>{ const k=(n+h/30)%12;
        const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);
        return Math.round(255*c).toString(16).padStart(2,"0");
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    function generatePalette(){
      let h1=0,h2=0,h3=0,h4=0,h5=0;
      const hueSeed=rand(0,360), hueRange=rand(1,10);
      if (hueRange===1){h1=hueSeed-130;h2=hueSeed-110;h3=hueSeed;h4=hueSeed+110;h5=hueSeed+130;}
      if (hueRange===2){h1=hueSeed+130;h2=hueSeed+110;h3=hueSeed;h4=hueSeed-110;h5=hueSeed-130;}
      if (hueRange===3){h1=hueSeed+60;h2=hueSeed+35;h3=hueSeed;h4=hueSeed-35;h5=hueSeed-60;}
      if (hueRange===4){h1=hueSeed-60;h2=hueSeed-35;h3=hueSeed;h4=hueSeed+35;h5=hueSeed+60;}
      if (hueRange===5){h1=hueSeed+190;h2=hueSeed+170;h3=hueSeed;h4=hueSeed-20;h5=hueSeed-40;}
      if (hueRange===6){h1=hueSeed-40;h2=hueSeed-20;h3=hueSeed;h4=hueSeed+170;h5=hueSeed+190;}
      if (hueRange===7){h1=hueSeed+30;h2=hueSeed+15;h3=hueSeed;h4=hueSeed-15;h5=hueSeed-30;}
      if (hueRange===8){h1=hueSeed-30;h2=hueSeed-15;h3=hueSeed;h4=hueSeed+15;h5=hueSeed+30;}
      if (hueRange===9){h1=hueSeed+145;h2=hueSeed+70;h3=hueSeed;h4=hueSeed-70;h5=hueSeed-145;}
      if (hueRange===10){h1=hueSeed-145;h2=hueSeed-70;h3=hueSeed;h4=hueSeed+70;h5=hueSeed+145;}
      h1=normHue(h1);h2=normHue(h2);h3=normHue(h3);h4=normHue(h4);h5=normHue(h5);
      const S=[70,60,55,60,70], L=[55,60,65,60,55];
      return [hslToHex(h1,S[0],L[0]),hslToHex(h2,S[1],L[1]),hslToHex(h3,S[2],L[2]),hslToHex(h4,S[3],L[3]),hslToHex(h5,S[4],L[4])];
    }

    // ---------- Gaussian field (offscreen) ----------
    function randn(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random();
      return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
    function gaussianKernel1D(sigma){
      const r=Math.max(1,Math.floor(sigma*3)), size=r*2+1;
      const k=new Float32Array(size); const s2=2*sigma*sigma; let sum=0;
      for(let i=-r,j=0;i<=r;i++,j++){ const val=Math.exp(-(i*i)/s2); k[j]=val; sum+=val; }
      for(let j=0;j<size;j++) k[j]/=sum;
      return {k,r};
    }
    function convolveSeparable(src,w,h,{k,r}){
      const tmp=new Float32Array(src.length), out=new Float32Array(src.length);
      for(let y=0;y<h;y++){
        const row=y*w;
        for(let x=0;x<w;x++){
          let acc=0; for(let i=-r;i<=r;i++){ const xx=Math.min(w-1,Math.max(0,x+i)); acc+=src[row+xx]*k[i+r]; }
          tmp[row+x]=acc;
        }
      }
      for(let x=0;x<w;x++){
        for(let y=0;y<h;y++){
          let acc=0; for(let i=-r;i<=r;i++){ const yy=Math.min(h-1,Math.max(0,y+i)); acc+=tmp[yy*w+x]*k[i+r]; }
          out[y*w+x]=acc;
        }
      }
      return out;
    }
    function normalize01(a){
      let mn=Infinity,mx=-Infinity; for(const v of a){ if(v<mn) mn=v; if(v>mx) mx=v; }
      const rng=mx-mn || 1; const out=new Float32Array(a.length);
      for(let i=0;i<a.length;i++) out[i]=(a[i]-mn)/rng;
      return out;
    }
    function quantize(a01,bands){
      const o=new Uint8Array(a01.length);
      for(let i=0;i<a01.length;i++){ let idx=Math.floor(a01[i]*bands); if(idx>=bands) idx=bands-1; o[i]=idx; }
      return o;
    }

    const genCanvas=document.createElement('canvas');
    const gctx=genCanvas.getContext('2d');

    function renderTessellation({sigma=9, scale=4, bands=5, palette}){
      const baseW=900, baseH=600;
      const w=Math.max(1, Math.floor(baseW/scale));
      const h=Math.max(1, Math.floor(baseH/scale));
      genCanvas.width=w; genCanvas.height=h;

      let field=new Float32Array(w*h);
      for(let i=0;i<field.length;i++) field[i]=randn();
      const ker=gaussianKernel1D(sigma);
      field=convolveSeparable(field,w,h,ker);

      const q=quantize(normalize01(field),bands);
      const img=gctx.createImageData(w,h);
      const data=img.data;
      for(let i=0;i<q.length;i++){
        const col=palette[q[i]%palette.length];
        const r=parseInt(col.slice(1,3),16), g=parseInt(col.slice(3,5),16), b=parseInt(col.slice(5,7),16);
        const p=i*4; data[p]=r; data[p+1]=g; data[p+2]=b; data[p+3]=255;
      }
      gctx.putImageData(img,0,0);
    }

    // ---------- Three.js scene ----------
    const stage = $('#stage');
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x151515);

    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
    camera.position.set(0, 1.1, 3);

    const controls = new OrbitControls(camera, renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 0.9));
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(3, 5, 4);
    scene.add(dir);

    const group = new THREE.Group();
    const geo1 = new THREE.SphereGeometry(0.8, 128, 64);
    const geo2 = new THREE.BoxGeometry(1.2, 1.2, 1.2, 64, 64, 64);
    const m1 = new THREE.Mesh(geo1); m1.position.x = -1.1;
    const m2 = new THREE.Mesh(geo2); m2.position.x =  1.1;
    group.add(m1, m2);
    scene.add(group);

    let PALETTE = generatePalette();
    renderTessellation({ sigma: 9, scale: 4, bands: 5, palette: PALETTE });

    const tex = new THREE.CanvasTexture(genCanvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(3, 3);

    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, metalness: 0.0 });
    m1.material = mat;
    m2.material = mat;

    // ---------- UI ----------
    const sigmaInput = $('#sigma'), sigmaVal = $('#sigmaVal');
    const scaleInput = $('#scale'), scaleVal = $('#scaleVal');
    const bandsInput = $('#bands'), bandsVal = $('#bandsVal');
    const repeatInput = $('#repeat'), repeatVal = $('#repeatVal');
    const regenBtn = $('#regen');
    const swatches = $('#swatches');

    function showSwatches(){
      swatches.innerHTML='';
      for(const col of PALETTE){
        const d=document.createElement('div'); d.className='swatch'; d.style.background=col;
        swatches.appendChild(d);
      }
    }
    showSwatches();

    function updateTexture(){
      const sigma=Number(sigmaInput.value);
      const scale=Number(scaleInput.value);
      const bands=Number(bandsInput.value);
      sigmaVal.textContent=sigma; scaleVal.textContent=scale; bandsVal.textContent=bands;

      renderTessellation({ sigma, scale, bands, palette: PALETTE });
      tex.needsUpdate = true;
    }

    regenBtn.addEventListener('click', ()=>{
      PALETTE = generatePalette();
      showSwatches();
      updateTexture();
    });
    sigmaInput.addEventListener('input', updateTexture);
    scaleInput.addEventListener('input', updateTexture);
    bandsInput.addEventListener('input', updateTexture);
    repeatInput.addEventListener('input', ()=>{
      const r = Number(repeatInput.value);
      repeatVal.textContent = r;
      tex.repeat.set(r, r);
      tex.needsUpdate = true;
    });

    // ---------- sizing & loop ----------
    function resize(){
      const w = stage.clientWidth || window.innerWidth;
      const h = stage.clientHeight || (window.innerHeight - (document.querySelector('header')?.offsetHeight || 0));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    // Defer first resize to next frame to ensure layout is computed
    requestAnimationFrame(() => { resize(); });

    function animate(){
      group.rotation.y += 0.0035;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    updateTexture();
    animate();

    // Debug
    console.log('stage size:', stage.clientWidth, stage.clientHeight);
    console.log('renderer size:', renderer.domElement.width, renderer.domElement.height);
  </script>
</body>
</html>
