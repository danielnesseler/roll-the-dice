<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Organic Pile Tessellation — Curved Cells</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: grid;
      grid-template-columns: 340px 1fr;
      height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0e1014; color: #eaecef;
    }
    aside {
      padding: 14px; border-right: 1px solid #0006;
      background: #12141b; overflow: auto;
    }
    main { display: grid; place-items: center; }
    canvas {
      width: min(96vw, 1600px); height: auto; background: #0f1117;
      border-radius: 14px; box-shadow: 0 12px 48px #000a;
    }
    h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity:.85; margin: 16px 0 8px; }
    .group { padding: 10px; border: 1px solid #ffffff18; border-radius: 10px; background: #0f1117; margin-bottom: 10px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin: 8px 0; }
    .row input[type="range"] { width: 100%; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .swatches { display:flex; gap:4px; flex-wrap:wrap; }
    .swatch { width:18px; height:18px; border-radius:4px; border: 1px solid #0006; }
    button { cursor: pointer; }
    small { opacity:.75; display:block; margin-top:8px; }
    label.inline { display:flex; align-items:center; gap:8px; }
  </style>
</head>
<body>
  <aside>
    <div class="group">
      <h2>Canvas</h2>
      <div class="row"><label>Width</label><input id="W" type="number" min="400" max="4000" value="1400"></div>
      <div class="row"><label>Height</label><input id="H" type="number" min="300" max="3000" value="900"></div>
      <div class="row"><label>Background</label><input id="bg" type="color" value="#0f1117"></div>
      <div class="two"><button id="resize">Resize</button><button id="save">Save PNG</button></div>
    </div>

    <div class="group">
      <h2>Cells</h2>
      <div class="row"><label>Cell count</label><input id="count" type="range" min="20" max="800" value="220"><span id="countV">220</span></div>
      <div class="row"><label>Relax (Lloyd)</label><input id="relax" type="range" min="0" max="10" value="3"><span id="relaxV">3</span></div>
      <div class="row"><label>Jitter (%)</label><input id="jitter" type="range" min="0" max="50" value="8"><span id="jitterV">8%</span></div>
      <div class="row"><label>Border</label>
        <select id="border">
          <option value="none">none</option>
          <option value="hair" selected>hairline</option>
          <option value="bold">bold</option>
        </select>
      </div>
      <div class="row"><label>Seed</label><input id="seed" type="number" value="1234567"><button id="dice">🎲</button></div>
    </div>

    <div class="group">
      <h2>Curvature</h2>
      <div class="row"><label class="inline"><input id="curved" type="checkbox" checked> Enable curved cells</label><span></span></div>
      <div class="row"><label>Iterations</label><input id="smoothIter" type="range" min="0" max="6" value="3"><span id="smoothIterV">3</span></div>
      <div class="row"><label>Roundness</label><input id="alpha" type="range" step="0.01" min="0.05" max="0.45" value="0.25"><span id="alphaV">0.25</span></div>
      <small>Higher iterations & roundness → smoother, more blobby cells. Chaikin corner-cutting is used.</small>
    </div>

    <div class="group">
      <h2>Palette</h2>
      <div class="row"><label>Mode</label>
        <select id="palMode">
          <option value="random">random HSL</option>
          <option value="triadic" selected>triadic</option>
          <option value="complement">complement</option>
          <option value="analogous">analogous</option>
          <option value="mono">mono</option>
        </select>
      </div>
      <div class="row"><label>Hue seed (°)</label><input id="hueSeed" type="range" min="0" max="359" value="20"><span id="hueSeedV">20</span></div>
      <div class="row"><label>Sat %</label><input id="sat" type="range" min="0" max="100" value="70"><span id="satV">70</span></div>
      <div class="row"><label>Light %</label><input id="lit" type="range" min="0" max="100" value="55"><span id="litV">55</span></div>
      <div class="row"><label>Palette size</label><input id="palSize" type="range" min="3" max="12" value="5"><span id="palSizeV">5</span></div>
      <div id="swatches" class="swatches"></div>
    </div>

    <div class="two">
      <button id="render">Render</button>
      <button id="shuffle">New sites</button>
    </div>
    <small>Tip: With Curved on, try Iterations 4–6 and Roundness ≈ 0.2–0.35.</small>
  </aside>

  <main>
    <canvas id="c" width="1400" height="900"></canvas>
  </main>

  <script type="module">
    // ---------- utilities ----------
    const $ = s => document.querySelector(s);
    const canvas = $('#c');
    const ctx = canvas.getContext('2d');

    // seeded RNG
    function mulberry32(a){
      return function(){
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const randRange = (r, a, b)=> a + r()*(b-a);
    const normHue = h => ((h%360)+360)%360;

    // ---------- palette ----------
    function hslToHex(h,s,l){
      l/=100; const a=(s*Math.min(l,1-l))/100;
      const f=n=>{ const k=(n+h/30)%12; const c=l-a*Math.max(Math.min(k-3,9-k,1),-1); return Math.round(255*c).toString(16).padStart(2,'0'); };
      return `#${f(0)}${f(8)}${f(4)}`;
    }
    function buildPalette(mode, size, hueSeed, sat, lit){
      if (mode === 'random'){
        const rng = mulberry32( (hueSeed|0) + 12345 );
        return Array.from({length:size}, ()=> hslToHex(Math.floor(randRange(rng, 0, 360)), sat, lit));
      }
      let offsets = [];
      if (mode==='triadic') offsets = [0,120,240];
      else if (mode==='complement') offsets=[0,180];
      else if (mode==='analogous') offsets=[-60,-30,0,30,60];
      else if (mode==='mono') offsets=[0];
      const hues = Array.from({length:size}, (_,i)=> normHue(hueSeed + offsets[i % offsets.length]));
      return hues.map(h=> hslToHex(h, sat, lit));
    }
    function showSwatches(hexes){
      const box = $('#swatches'); box.innerHTML = '';
      for (const h of hexes){
        const d = document.createElement('div');
        d.className='swatch'; d.style.background = h; box.appendChild(d);
      }
    }

    // ---------- Voronoi by half-plane clipping ----------
    function clipPolyHalfplane(poly, d, mid){
      const out = [];
      const n = poly.length;
      for (let i=0;i<n;i++){
        const A = poly[i];
        const B = poly[(i+1)%n];
        const Av = (A.x - mid.x)*d.x + (A.y - mid.y)*d.y;
        const Bv = (B.x - mid.x)*d.x + (B.y - mid.y)*d.y;
        const Ain = Av <= 0, Bin = Bv <= 0;
        if (Ain && Bin){
          out.push(B);
        } else if (Ain && !Bin){
          const t = Av / (Av - Bv);
          out.push({ x: A.x + t*(B.x - A.x), y: A.y + t*(B.y - A.y) });
        } else if (!Ain && Bin){
          const t = Av / (Av - Bv);
          out.push({ x: A.x + t*(B.x - A.x), y: A.y + t*(B.y - A.y) });
          out.push(B);
        }
      }
      return out;
    }
    function computeVoronoiPolys(sites, W, H){
      const polys = [];
      const rect = [ {x:0,y:0}, {x:W,y:0}, {x:W,y:H}, {x:0,y:H} ];
      for (let i=0;i<sites.length;i++){
        let poly = rect.slice();
        const si = sites[i];
        for (let j=0;j<sites.length;j++){
          if (i===j) continue;
          const sj = sites[j];
          const mid = { x: (si.x + sj.x)/2, y: (si.y + sj.y)/2 };
          const d   = { x: sj.x - si.x,     y: sj.y - si.y };
          poly = clipPolyHalfplane(poly, d, mid);
          if (poly.length===0) break;
        }
        polys.push(poly);
      }
      return polys;
    }

    // ---------- centroid & Lloyd ----------
    function polygonCentroid(poly){
      let A=0, cx=0, cy=0;
      for (let i=0;i<poly.length;i++){
        const p = poly[i], q = poly[(i+1)%poly.length];
        const c = p.x*q.y - p.y*q.x;
        A += c; cx += (p.x + q.x) * c; cy += (p.y + q.y) * c;
      }
      A *= 0.5;
      if (Math.abs(A) < 1e-7) {
        let sx=0, sy=0; for (const p of poly){ sx+=p.x; sy+=p.y; }
        return { x: sx/poly.length, y: sy/poly.length };
      }
      return { x: cx/(6*A), y: cy/(6*A) };
    }
    function lloydRelaxation(sites, W, H, iterations){
      let current = sites.map(p=>({x:p.x, y:p.y}));
      for (let it=0; it<iterations; it++){
        const cells = computeVoronoiPolys(current, W, H);
        const next = current.map((p,idx)=> polygonCentroid(cells[idx]));
        current = next;
      }
      return current;
    }

    // ---------- Chaikin corner-cutting (curving polygons) ----------
    // alpha in (0, .5). More alpha → more rounding. iterations >= 0.
    function chaikinOnce(poly, alpha){
      const n = poly.length;
      if (n < 3) return poly.slice();
      const out = [];
      for (let i=0;i<n;i++){
        const A = poly[i];
        const B = poly[(i+1)%n];
        const Q = { x: (1-alpha)*A.x + alpha*B.x, y: (1-alpha)*A.y + alpha*B.y };
        const R = { x: alpha*A.x + (1-alpha)*B.x, y: alpha*A.y + (1-alpha)*B.y };
        out.push(Q, R);
      }
      return out;
    }
    function chaikin(poly, iterations, alpha){
      let p = poly;
      for (let i=0;i<iterations;i++){
        p = chaikinOnce(p, alpha);
      }
      return p;
    }

    // ---------- draw ----------
    function drawPolys(polys, colors, borderKind, bg, curved, iter, alpha){
      ctx.fillStyle = bg;
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.lineJoin = 'round';
      ctx.lineCap  = 'round';

      for (let i=0;i<polys.length;i++){
        let poly = polys[i];
        if (poly.length < 3) continue;

        if (curved && iter>0){
          poly = chaikin(poly, iter, alpha);
        }

        ctx.beginPath();
        ctx.moveTo(poly[0].x, poly[0].y);
        for (let k=1;k<poly.length;k++) ctx.lineTo(poly[k].x, poly[k].y);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        if (borderKind !== 'none'){
          ctx.save();
          ctx.strokeStyle = '#00000066';
          ctx.lineWidth = (borderKind==='bold') ? 1.25 : 0.6;
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    // ---------- UI wiring ----------
    const ui = {
      W: $('#W'), H: $('#H'), bg: $('#bg'), resize: $('#resize'), save: $('#save'),
      count: $('#count'), countV: $('#countV'),
      relax: $('#relax'), relaxV: $('#relaxV'),
      jitter: $('#jitter'), jitterV: $('#jitterV'),
      border: $('#border'),
      seed: $('#seed'), dice: $('#dice'),

      curved: $('#curved'),
      smoothIter: $('#smoothIter'), smoothIterV: $('#smoothIterV'),
      alpha: $('#alpha'), alphaV: $('#alphaV'),

      palMode: $('#palMode'), hueSeed: $('#hueSeed'), hueSeedV: $('#hueSeedV'),
      sat: $('#sat'), satV: $('#satV'),
      lit: $('#lit'), litV: $('#litV'),
      palSize: $('#palSize'), palSizeV: $('#palSizeV'),
      render: $('#render'), shuffle: $('#shuffle'),
      swatches: $('#swatches')
    };

    function syncLabels(){
      ui.countV.textContent = ui.count.value;
      ui.relaxV.textContent = ui.relax.value;
      ui.jitterV.textContent = ui.jitter.value + '%';
      ui.hueSeedV.textContent = ui.hueSeed.value;
      ui.satV.textContent = ui.sat.value;
      ui.litV.textContent = ui.lit.value;
      ui.palSizeV.textContent = ui.palSize.value;
      ui.smoothIterV.textContent = ui.smoothIter.value;
      ui.alphaV.textContent = Number(ui.alpha.value).toFixed(2);
    }

    // state
    let sites = [];

    function reseedSites(){
      const W = canvas.width, H = canvas.height;
      const rng = mulberry32( (+ui.seed.value|0)>>>0 );
      const N = +ui.count.value;
      const jitter = +ui.jitter.value / 100;
      sites = [];
      for (let i=0;i<N;i++){
        const x = randRange(rng, 0, W);
        const y = randRange(rng, 0, H);
        sites.push({ x: x + (rng()-0.5)*jitter*W*0.02, y: y + (rng()-0.5)*jitter*H*0.02 });
      }
    }

    function render(){
      syncLabels();

      const palette = buildPalette(ui.palMode.value, +ui.palSize.value, +ui.hueSeed.value, +ui.sat.value, +ui.lit.value);
      showSwatches(palette);

      const relaxed = (+ui.relax.value>0) ? lloydRelaxation(sites, canvas.width, canvas.height, +ui.relax.value) : sites;
      const polys = computeVoronoiPolys(relaxed, canvas.width, canvas.height);

      drawPolys(
        polys, palette, ui.border.value, ui.bg.value,
        ui.curved.checked, +ui.smoothIter.value, Number(ui.alpha.value)
      );
    }

    // events
    ['count','relax','jitter','border','palMode','hueSeed','sat','lit','palSize','bg','curved','smoothIter','alpha'].forEach(id=>{
      $('#'+id).addEventListener('input', ()=>{ syncLabels(); render(); });
    });
    ui.resize.addEventListener('click', ()=>{
      canvas.width  = +ui.W.value;
      canvas.height = +ui.H.value;
      render();
    });
    ui.save.addEventListener('click', ()=>{
      const a = document.createElement('a');
      a.download = 'pile_tessellation_curved.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });
    ui.dice.addEventListener('click', ()=>{
      ui.seed.value = Math.floor(Math.random()*1e9);
      reseedSites(); render();
    });
    ui.shuffle.addEventListener('click', ()=>{
      reseedSites(); render();
    });
    ui.render.addEventListener('click', render);

    // init
    (function init(){
      canvas.width  = +ui.W.value;
      canvas.height = +ui.H.value;
      reseedSites();
      render();
    })();
  </script>
</body>
</html>
