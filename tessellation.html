<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gaussian Field Tessellation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    header { padding: 12px 16px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #00000022; }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
    .swatches { display: inline-flex; gap: 4px; margin-left: auto; }
    .swatch { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #00000033; }
    main { display: grid; place-items: center; background: #111; }
    canvas { width: min(90vw, 900px); height: auto; box-shadow: 0 8px 30px #0008; background:#222; border-radius: 16px; }
    button, input[type="range"] { cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <button id="regen">Regenerate</button>
    <label>σ (blur):
      <input id="sigma" type="range" min="1" max="18" value="9" />
      <span id="sigmaVal">9</span>
    </label>
    <label>Scale:
      <input id="scale" type="range" min="2" max="8" value="4" />
      <span id="scaleVal">4</span>
    </label>
    <label>Bands:
      <input id="bands" type="range" min="3" max="12" value="5" />
      <span id="bandsVal">5</span>
    </label>
    <div class="swatches" id="swatches"></div>
  </header>
  <main>
    <canvas id="c" width="900" height="600"></canvas>
  </main>

  <script>
    // ---------------- palette generator (browser-only, no npm) -------------
    const rand = (min, max) => {
      const minC = Math.ceil(min), maxF = Math.floor(max);
      return Math.floor(Math.random() * (maxF - minC + 1) + minC);
    };
    const normHue = (h) => ((h % 360) + 360) % 360;

    function generatePalette() {
      // hues
      let h1=0,h2=0,h3=0,h4=0,h5=0;
      const hueSeed = rand(0,360);
      const hueRange = rand(1,10);
      if (hueRange===1){ h1=hueSeed-130; h2=hueSeed-110; h3=hueSeed; h4=hueSeed+110; h5=hueSeed+130; }
      if (hueRange===2){ h1=hueSeed+130; h2=hueSeed+110; h3=hueSeed; h4=hueSeed-110; h5=hueSeed-130; }
      if (hueRange===3){ h1=hueSeed+60;  h2=hueSeed+35;  h3=hueSeed; h4=hueSeed-35;  h5=hueSeed-60;  }
      if (hueRange===4){ h1=hueSeed-60;  h2=hueSeed-35;  h3=hueSeed; h4=hueSeed+35;  h5=hueSeed+60;  }
      if (hueRange===5){ h1=hueSeed+190; h2=hueSeed+170; h3=hueSeed; h4=hueSeed-20;  h5=hueSeed-40;  }
      if (hueRange===6){ h1=hueSeed-40;  h2=hueSeed-20;  h3=hueSeed; h4=hueSeed+170; h5=hueSeed+190; }
      if (hueRange===7){ h1=hueSeed+30;  h2=hueSeed+15;  h3=hueSeed; h4=hueSeed-15;  h5=hueSeed-30;  }
      if (hueRange===8){ h1=hueSeed-30;  h2=hueSeed-15;  h3=hueSeed; h4=hueSeed+15;  h5=hueSeed+30;  }
      if (hueRange===9){ h1=hueSeed+145; h2=hueSeed+70;  h3=hueSeed; h4=hueSeed-70;  h5=hueSeed-145; }
      if (hueRange===10){h1=hueSeed-145; h2=hueSeed-70;  h3=hueSeed; h4=hueSeed+70;  h5=hueSeed+145; }
      h1=normHue(h1); h2=normHue(h2); h3=normHue(h3); h4=normHue(h4); h5=normHue(h5);

      // saturation patterns
      let sata=0,satb=0,satc=0,satd=0,sate=0;
      const sSeed = rand(1,36);
      const setS = (a,b,c,d,e)=>{sata=a;satb=b;satc=c;satd=d;sate=e;};
      const S = [
        [95,95,95,95,95],[85,85,85,85,85],[75,75,75,75,75],[66,66,66,66,66],
        [50,50,50,50,50],[40,40,40,40,40],[30,30,30,30,30],[20,20,20,20,20],
        [30,40,50,60,70],[70,60,50,40,30],[33,50,70,50,33],[33,70,50,70,33],
        [50,70,33,70,50],[50,33,70,33,50],[70,50,33,50,70],[70,33,50,33,70],
        [30,40,50,40,30],[30,50,40,50,30],[40,30,50,30,40],[40,50,30,50,40],
        [50,40,30,40,50],[50,30,40,30,50],[50,60,70,60,50],[50,70,60,70,50],
        [60,50,70,50,60],[60,70,50,70,60],[70,60,50,60,70],[70,50,60,50,70],
        [95,85,75,66,55],[55,66,75,85,95],[75,85,95,85,75],[75,95,85,95,75],
        [85,95,75,95,85],[85,75,95,75,85],[95,85,75,85,95],[95,75,85,75,95]
      ];
      setS(...S[sSeed-1]);

      // lightness patterns
      let lita=0,litb=0,litc=0,litd=0,lite=0;
      const lSeed = rand(1,40);
      const setL = (a,b,c,d,e)=>{lita=a;litb=b;litc=c;litd=d;lite=e;};
      const L = [
        [85,85,85,85,85],[75,75,75,75,75],[66,66,66,66,66],[50,50,50,50,50],
        [40,40,40,40,40],[30,30,30,30,30],[40,50,60,70,80],[80,70,60,50,40],
        [80,66,50,66,80],[80,50,66,50,80],[66,80,50,80,66],[66,50,80,50,66],
        [50,66,80,66,50],[50,80,66,80,50],[80,70,60,70,80],[80,60,70,60,80],
        [70,60,80,60,70],[70,80,60,80,70],[60,70,80,70,60],[60,80,70,80,60],
        [20,30,40,50,60],[60,50,40,30,20],[30,40,50,40,30],[30,50,40,50,30],
        [40,50,30,50,40],[40,30,50,30,40],[50,40,30,40,50],[50,30,40,30,50],
        [40,50,60,50,40],[40,60,50,60,40],[50,40,60,40,50],[50,60,40,60,50],
        [60,50,40,50,60],[60,40,50,40,60],[70,60,50,60,70],[70,50,60,50,70],
        [60,70,50,70,60],[60,50,70,50,60],[50,60,70,60,50],[50,70,60,70,50],
      ];
      setL(...L[lSeed-1]);

      const hslToHex = (h,s,l)=>{
        l/=100; const a=(s*Math.min(l,1-l))/100;
        const f=n=>{ const k=(n+h/30)%12;
          const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);
          return Math.round(255*c).toString(16).padStart(2,'0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
      };

      const hex = [
        hslToHex(h1,sata,lita),
        hslToHex(h2,satb,litb),
        hslToHex(h3,satc,litc),
        hslToHex(h4,satd,litd),
        hslToHex(h5,sate,lite),
      ];
      return hex;
    }

    // ---------------- UI / Canvas -----------------------------------------
    const $ = (s) => document.querySelector(s);
    const canvas = $('#c');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const sigmaInput = $('#sigma');
    const scaleInput = $('#scale');
    const bandsInput = $('#bands');
    const sigmaVal = $('#sigmaVal');
    const scaleVal = $('#scaleVal');
    const bandsVal = $('#bandsVal');
    const regenBtn = $('#regen');
    const swatches = $('#swatches');

    let PALETTE = generatePalette();

    function showSwatches() {
      swatches.innerHTML = '';
      for (const col of PALETTE) {
        const d = document.createElement('div');
        d.className = 'swatch';
        d.style.background = col;
        swatches.appendChild(d);
      }
    }
    showSwatches();

    // ----------- Gaussian field + blur + quantize -------------------------
    function randn() {
      let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
      return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
    }

    function gaussianKernel1D(sigma) {
      const r = Math.max(1, Math.floor(sigma*3));
      const size = r*2+1;
      const k = new Float32Array(size);
      const s2 = 2*sigma*sigma; let sum=0;
      for (let i=-r,j=0;i<=r;i++,j++){ const val=Math.exp(-(i*i)/s2); k[j]=val; sum+=val; }
      for (let j=0;j<size;j++) k[j]/=sum;
      return {k,r};
    }

    function convolve1DHorizontal(src,w,h,{k,r}) {
      const out=new Float32Array(src.length);
      for(let y=0;y<h;y++){
        const row=y*w;
        for(let x=0;x<w;x++){
          let acc=0;
          for(let i=-r;i<=r;i++){
            const xx=Math.min(w-1,Math.max(0,x+i));
            acc+=src[row+xx]*k[i+r];
          }
          out[row+x]=acc;
        }
      }
      return out;
    }

    function convolve1DVertical(src,w,h,{k,r}) {
      const out=new Float32Array(src.length);
      for(let x=0;x<w;x++){
        for(let y=0;y<h;y++){
          let acc=0;
          for(let i=-r;i<=r;i++){
            const yy=Math.min(h-1,Math.max(0,y+i));
            acc+=src[yy*w+x]*k[i+r];
          }
          out[y*w+x]=acc;
        }
      }
      return out;
    }

    function generateField(w,h){
      const f=new Float32Array(w*h);
      for(let i=0;i<f.length;i++) f[i]=randn();
      return f;
    }

    function normalize01(a){
      let mn=Infinity,mx=-Infinity;
      for(const v of a){ if(v<mn) mn=v; if(v>mx) mx=v; }
      const rng=mx-mn || 1;
      const out=new Float32Array(a.length);
      for(let i=0;i<a.length;i++) out[i]=(a[i]-mn)/rng;
      return out;
    }

    function quantizeToBands(a01,bands){
      const out=new Uint8Array(a01.length);
      for(let i=0;i<a01.length;i++){
        let idx=Math.floor(a01[i]*bands);
        if(idx>=bands) idx=bands-1;
        out[i]=idx;
      }
      return out;
    }

    function paintQuantized(q,w,h,palette){
      // Use an offscreen canvas via DOM for Safari compatibility
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const octx = off.getContext('2d');
      const img = octx.createImageData(w,h);
      const data = img.data;

      for (let i=0;i<q.length;i++){
        const band=q[i]%palette.length;
        const hex=palette[band];
        const r=parseInt(hex.slice(1,3),16);
        const g=parseInt(hex.slice(3,5),16);
        const b=parseInt(hex.slice(5,7),16);
        const p=i*4;
        data[p+0]=r; data[p+1]=g; data[p+2]=b; data[p+3]=255;
      }
      octx.putImageData(img,0,0);

      // scale up to main canvas without smoothing (pixelated tessellation look)
      ctx.imageSmoothingEnabled=false;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(off,0,0,canvas.width,canvas.height);
    }

    function render(){
      const sigma=Number(sigmaInput.value);
      const scale=Number(scaleInput.value);
      const bands=Number(bandsInput.value);
      sigmaVal.textContent=sigma; scaleVal.textContent=scale; bandsVal.textContent=bands;

      const w=Math.floor(canvas.width/scale);
      const h=Math.floor(canvas.height/scale);

      let field=generateField(w,h);
      const kernel=gaussianKernel1D(sigma);
      field=convolve1DHorizontal(field,w,h,kernel);
      field=convolve1DVertical(field,w,h,kernel);

      const q=quantizeToBands(normalize01(field),bands);
      paintQuantized(q,w,h,PALETTE);
    }

    // UI events
    regenBtn.addEventListener('click', ()=>{
      PALETTE = generatePalette();   // brand new palette each time
      showSwatches();
      render();
    });
    sigmaInput.addEventListener('input', render);
    scaleInput.addEventListener('input', render);
    bandsInput.addEventListener('input', render);

    // initial paint
    render();
  </script>
</body>
</html>
