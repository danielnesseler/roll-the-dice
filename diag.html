<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Diag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{margin:0;height:100%;background:#111;color:#eee;font:14px system-ui}
    #c{display:block;width:100vw;height:100vh}
    #msg{position:fixed;left:8px;top:8px;background:#0009;padding:6px 8px;border-radius:8px}
  </style>
</head>
<body>
  <canvas id="c" width="900" height="600"></canvas>
  <div id="msg">diagnostic: drawing to 2D canvas…</div>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    function resize(){
      c.width = innerWidth * devicePixelRatio;
      c.height = innerHeight * devicePixelRatio;
    }
    addEventListener('resize', resize); resize();

    let t=0;
    function loop(){
      t += 0.01;
      // gradient bg
      const g = ctx.createLinearGradient(0,0,c.width,c.height);
      g.addColorStop(0, '#223'); g.addColorStop(1,'#112');
      ctx.fillStyle = g; ctx.fillRect(0,0,c.width,c.height);
      // moving dot
      const r = Math.min(c.width, c.height)*0.3;
      const x = c.width/2 + Math.cos(t)*r;
      const y = c.height/2 + Math.sin(t)*r*0.5;
      ctx.beginPath(); ctx.arc(x,y, 18*devicePixelRatio, 0, Math.PI*2);
      ctx.fillStyle = '#0cf'; ctx.fill();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
